name = "tools-molyuk-com"
compatibility_date = "2026-08-29"
main = "worker/index.ts"

[[routes]]
pattern = "tools.molyuk.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
# The worker decides what a miss is (see worker/index.ts) so unknown paths can answer
# 404 for real; "single-page-application" here would hand back the shell as a 200.
not_found_handling = "none"
